<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bing Flight Simulator</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070c;
    font-family:Consolas,"DejaVu Sans Mono",monospace;color:#c8d2dd;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:absolute;inset:0}
  #gl{display:block;width:100%;height:100%;background:#05070c}
  #ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:#05070c;text-align:center;padding:24px;
    box-sizing:border-box;z-index:10}
  #ovl.gone{display:none}
  .bfs-logo{font-size:26px;letter-spacing:.34em;color:#e8eef5;font-weight:700}
  .bfs-logo small{display:block;font-size:11px;letter-spacing:.22em;color:#5c9ad6;
    margin-top:7px;font-weight:400}
  #msg{font-size:12px;color:#7d8b99;max-width:46ch;line-height:1.65}
  #err{font-size:12px;color:#e0574a;max-width:60ch;line-height:1.6;white-space:pre-wrap;
    text-align:left;display:none}
  #go{margin-top:6px;padding:9px 26px;font:inherit;font-size:13px;letter-spacing:.1em;
    color:#05070c;background:#5c9ad6;border:0;border-radius:2px;cursor:pointer}
  #go:hover{background:#7ab0e4}
  #go[disabled]{background:#2b3644;color:#66727f;cursor:default}
  #bar{width:230px;height:2px;background:#1a2029;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#5c9ad6;transition:width .18s}
  .pill{position:absolute;left:8px;bottom:8px;font-size:10px;color:#6c7a88;
    background:rgba(6,10,16,.72);padding:3px 8px;border-radius:2px;z-index:5;display:none}
</style>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="pill" id="pill"></div>
  <div id="ovl">
    <div class="bfs-logo">BING<small>FLIGHT SIMULATOR</small></div>
    <div id="bar"><i></i></div>
    <div id="msg">Loading…</div>
    <div id="err"></div>
    <button id="go" disabled>CLICK TO START</button>
  </div>
</div>

width: 148 * FT,
displaced: [797 * FT, 551 * FT],

};
var _frame = null, _len = 0, _brg = 0;
function frame() {
if (_frame) return _frame;
_frame = new Geo.Frame(THR12.lat, THR12.lon, THR12.elev);
_len = Geo.distance(THR12.lat, THR12.lon, THR30.lat, THR30.lon);
_brg = Geo.bearing(THR12.lat, THR12.lon, THR30.lat, THR30.lon);

}
function length() { frame(); return _len; }

frame();
Geo.destination(_dest, THR12.lat, THR12.lon, _brg, u);

}
var _enu = new Float64Array(3);
function toLocal(out, lat, lon) {
frame().geodeticToEnu(_enu, lat, lon, 0);
var b = _brg * U.DEG;

}

var t0 = 0, t1 = 0.55, t2 = 1;
return a * ((t - t1) * (t - t2)) / ((t0 - t1) * (t0 - t2)) +
peak * ((t - t0) * (t - t2)) / ((t1 - t0) * (t1 - t2)) +
b * ((t - t0) * (t - t1)) / ((t2 - t0) * (t2 - t1));

{ id: "A1", width: 23, pts: [[95, 40], [140, 118]] },
{ id: "A2", width: 23, pts: [[1150, 118], [1200, 168]] },
{ id: "A3", width: 23, pts: [[1900, 118], [1950, 168]] },

{ id: "B",  width: 23, pts: [[1180, 168], [2010, 168]] }
];

var STANDS = (function () {

id: String(i),
u: STAND_U0 + (i - 1) * STAND_PITCH,
v: STAND_V,
hdg: U.wrap360(bearingOffset(-90)),
airbridge: i === 7 || i === 10,
code: "C"
});
}
return out;
})();
function bearingOffset(d) { return bearing() + d; }
var STAND_BY_ID = {};
for (var i = 0; i < STANDS.length; i++) STAND_BY_ID[STANDS[i].id] = STANDS[i];
function spawn(standId) {
var s = STAND_BY_ID[standId || "7"] || STANDS[6];
var g = new Float64Array(2);
toGeo(g, s.u, s.v - 11);
return {
lat: g[0], lon: g[1],
elev: pavementElev(s.u, s.v),
hdg: s.hdg,
stand: s
};
}
var ILS = [
{ rwy: "30", crs: U.wrap360(0), gs: 3.0, thrLat: THR30.lat, thrLon: THR30.lon,
thrElev: THR30.elev, freq: null },
{ rwy: "12", crs: U.wrap360(0), gs: 3.0, thrLat: THR12.lat, thrLon: THR12.lon,
thrElev: THR12.elev, freq: null }

function ils(rwy) {

for (var i = 0; i < ILS.length; i++) {
if (ILS[i].rwy === rwy) {

}

var NAVAIDS = [
{ id: "BCN", name: "Brecon",   type: "VOR-DME", freq: 117.45, lat: 51.725601, lon: -3.263060 },
{ id: "SAT", name: "St Athan", type: "TACAN",   freq: 114.80, lat: 51.406399, lon: -3.434970 },
{ id: "BRI", name: "Bristol",  type: "NDB",     freq: 414,    lat: 51.381401, lon: -2.717540 },
{ id: "SWN", name: "Swansea",  type: "NDB",     freq: 321,    lat: 51.602200, lon: -4.065830 }
];
return {
ident: "EGFF", iata: "CWL", name: "Cardiff Airport",
ARP: ARP, THR12: THR12, THR30: THR30, RWY: RWY,
APRON: APRON, TERMINAL: TERMINAL, TOWER: TOWER,

BFS.State.placeAt(sim, s.lat, s.lon, s.elev + 3.05, s.hdg);
sim.ctl.parkBrake = true;
}
BFS.MassBalance.init(sim, { fuel: 5200, payload: 13500 });
for (var i = 0; i < 2; i++) {
var e = sim.sys.eng[i];
e.master = !!p.engines;
e.running = !!p.engines;
e.lit = !!p.engines;
if (p.engines) {
e.n1 = BFS.A320.C.n1Idle; e.n2 = BFS.A320.C.n2Idle;
e.egt = 380; e.oilPsi = 78;
}
}
sim.sys.gear.pos = [1, 1, 1];
sim.ctl.groundSpoilers = true;
sim.fcu.hdg = Math.round(sim.adr.hdgMag || E.bearing());
sim.fcu.alt = 5000;
sim.fcu.spd = 250;
sim.fma.thr = "MAN"; sim.fma.vert = ""; sim.fma.lat = "";
frame = new Geo.Frame(sim.truth.geo[0], sim.truth.geo[1], sim.truth.geo[2]);
if (scene) scene.terrain.ready = false;
}
function updateFrame() {
var t = sim.truth;
frame.geodeticToEnu(t.enu, t.geo[0], t.geo[1], t.geo[2]);
if (Math.hypot(t.enu[0], t.enu[1]) > Geo.REBASE_M) {
frame.setOrigin(t.geo[0], t.geo[1], frame.h);
frame.geodeticToEnu(t.enu, t.geo[0], t.geo[1], t.geo[2]);
rebases++;
}
}
function step(dt) {
atmos.update(sim, dt);
if (clock.is30Hz()) {
adirs.update(sim, dt * 4);
BFS.MassBalance.update(sim);
sim._speeds = adirs.speeds(sim);
}
fctl.directLaw(sim, dt);
fctl.update(sim, dt);
engines.update(sim, dt);
body.reset();
aero.update(sim, dt);
body.addForce(sim.aero.F);
body.addMoment(sim.aero.M);
engines.applyForces(sim, body);
gear.update(sim, body, dt);
body.integrate(sim, dt);
body.derive(sim);
updateFrame();
sim.t = clock.t;
}
var hud = document.createElement("div");
hud.style.cssText =
"position:absolute;left:8px;top:8px;z-index:6;font:11px/1.5 Consolas,monospace;" +
"color:#a8bccd;background:rgba(6,10,16,.62);padding:7px 10px;border-radius:2px;" +
"white-space:pre;pointer-events:none";
canvas.parentNode.appendChild(hud);
var toast = document.createElement("div");
toast.style.cssText =
"position:absolute;left:50%;transform:translateX(-50%);bottom:52px;z-index:6;" +
"font:13px Consolas,monospace;color:#dce6f0;text-shadow:0 1px 3px #000;" +
"pointer-events:none;text-align:center";
canvas.parentNode.appendChild(toast);
var debugOn = params.get("debug") !== "0";
function drawHud() {
if (!debugOn) { hud.style.display = "none"; } else {
hud.style.display = "block";
var a = sim.adr, e = sim.sys.eng;
hud.textContent =
"BING FLIGHT SIMULATOR   " + clock.fps.toFixed(0) + " fps   " +
(clock.load * 100).toFixed(0) + "%   x" + renderScale.toFixed(2) + "\n" +
"IAS " + a.ias.toFixed(0).padStart(3) + " kt    ALT " +
a.altBaro.toFixed(0).padStart(6) + " ft    VS " + a.vs.toFixed(0).padStart(5) + "\n" +
"HDG " + a.hdgMag.toFixed(0).padStart(3) + "     PITCH " +
a.pitch.toFixed(1).padStart(5) + "    ROLL " + a.roll.toFixed(1).padStart(6) + "\n" +
"AoA " + a.aoa.toFixed(1).padStart(5) + "    Nz " + a.load.toFixed(2) +
"     RA " + (a.ralt >= 0 ? a.ralt.toFixed(0) : "---") + "\n" +
"N1  " + e[0].n1.toFixed(1).padStart(5) + " / " + e[1].n1.toFixed(1).padStart(5) +
"   EGT " + e[0].egt.toFixed(0) + "   FF " + (e[0].ff * 3600).toFixed(0) + " kg/h\n" +
"FLAP " + sim.surf.flap.toFixed(0) + "/" + sim.surf.slat.toFixed(0) +
"   GEAR " + sim.sys.gear.pos.map(function (p) { return p.toFixed(1); }).join(" ") +
"   " + (sim.truth.onGround ? "ON GROUND" : "AIRBORNE") + "\n" +
"GW " + (sim.mass.m / 1000).toFixed(1) + " t   CG " + sim.mass.cgPctMac.toFixed(1) +
"%   FUEL " + sim.mass.fuel.total.toFixed(0) + " kg\n" +
"buffet " + (sim.aero.buffet || 0).toFixed(2) + "   rebases " + rebases +
(clock.paused ? "   PAUSED" : "");
}
var n = input.notices;
toast.innerHTML = n.map(function (x) {
return '<div style="opacity:' + U.clamp(1 - x.t / 3.2, 0, 1).toFixed(2) + '">' +
x.text + "</div>";
}).join("");
}
function tuneQuality() {
if (clock.load > 1.4 && renderScale > 0.55) { renderScale -= 0.08; resize(); }
else if (clock.load < 0.72 && renderScale < 1) { renderScale = Math.min(1, renderScale + 0.04); resize(); }
}
var started = false;
function loop(wallMs) {
requestAnimationFrame(loop);
if (!resize()) return;
var steps = clock.beginFrame(wallMs);
input.update(sim, Math.max(1 / 240, clock.frameMs.mean() / 1000));
for (var i = 0; i < steps; i++) { clock.advance(); step(clock.step); }
tuneQuality();
scene.terrain.update(sim, frame);
scene.setAttitude(sim.truth.quat);
sim._wind = { dir: atmos.windDirDeg, kt: atmos.windKt };
scene.updateDisplays(sim, clock.t);
scene.render(sim, input, frame, viewW, viewH, clock.t);
drawHud();
}
message.innerHTML = "Loading Cardiff…";
var PRESET_LABELS = {
turnaround: "At the gate — stand 7",
lineup: "Lined up — runway 12",
approach: "Short final — runway 30"
};
return BFS.Height.init().then(function () {
var wanted = params.get("preset");
applyPreset(PRESETS[wanted] ? wanted : "turnaround");
if (params.has("wind")) atmos.windKt = Math.max(0, +params.get("wind") || 0);
if (params.has("winddir")) atmos.windDirDeg = +params.get("winddir") || 0;
if (params.has("turb")) atmos.turbulence = U.clamp(+params.get("turb") || 0, 0, 1);
scene = new BFS.Scene.Scene(gl, canvas);
scene.setAttitude(sim.truth.quat);
BFS.debug = { sim: sim, scene: scene, clock: clock, input: input, gl: gl,
atmos: atmos, aero: aero, frame: function () { return frame; } };
message.innerHTML =
"<b>Cardiff Airport (EGFF)</b><br>" +
"Arrows fly · , . rudder · PgUp/PgDn thrust · G gear · [ ] flaps<br>" +
"B parking brake · Space brakes · V speedbrake · R reverse<br>" +
"F1–F7 views · drag to look · P pause";
var picker = document.createElement("div");
picker.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;justify-content:center";
Object.keys(PRESETS).forEach(function (key) {
var b = document.createElement("button");
b.textContent = PRESET_LABELS[key];
b.style.cssText =
"font:inherit;font-size:11px;letter-spacing:.06em;padding:6px 12px;" +
"border-radius:2px;cursor:pointer;border:1px solid #2b3644;" +
(key === sim.preset ? "background:#5c9ad6;color:#05070c;border-color:#5c9ad6"
: "background:#141a22;color:#8fa0b0");
b.onclick = function () {
applyPreset(key);
scene.terrain.ready = false;
scene.setAttitude(sim.truth.quat);
[].forEach.call(picker.children, function (o, i) {
var on = Object.keys(PRESETS)[i] === key;
o.style.background = on ? "#5c9ad6" : "#141a22";
o.style.color = on ? "#05070c" : "#8fa0b0";
o.style.borderColor = on ? "#5c9ad6" : "#2b3644";
});
};
picker.appendChild(b);
});
message.parentNode.insertBefore(picker, button);
button.disabled = false;
button.textContent = "FLY";
return new Promise(function (resolve) {
button.addEventListener("click", function () {
if (started) return;
started = true;
overlay.classList.add("gone");
canvas.tabIndex = 0;
canvas.focus();
clock.bindVisibility(function (c) {
if (host.pill) {
host.pill.textContent = c.paused ? "Paused — " + c.pauseReason : "";
host.pill.style.display = c.paused ? "block" : "none";
}
});
resize();
requestAnimationFrame(loop);
resolve();
});
});
}).catch(function (e) {
message.style.color = "#e0574a";
message.textContent = "Startup failed: " + (e && e.stack ? e.stack : e);
button.style.display = "none";
throw e;
});
};
})();
</script>
<script>
/* Bing Flight Simulator — boot loader.
   The simulator is shipped as one gzip+base64 blob because this page is opened
   inside WinClone's HTML Viewer, whose sandbox gives us an opaque origin: the
   file lives in localStorage as a JSON string, and base64 is the only encoding
   that costs nothing to JSON-escape. See flightsim/README.md. */
(function () {
  "use strict";
  var ovl = document.getElementById("ovl"),
      msg = document.getElementById("msg"),
      err = document.getElementById("err"),
      go  = document.getElementById("go"),
      bar = document.querySelector("#bar i");

  function step(pct, text) { bar.style.width = pct + "%"; if (text) msg.textContent = text; }
  function fail(what, e) {
    msg.textContent = "Bing Flight Simulator could not start.";
    err.style.display = "block";
    err.textContent = what + "\n\n" + (e && e.stack ? e.stack : e) +
      "\n\nIf this build is the compressed one, try BingFlightSimulator.debug.html instead.";
    go.style.display = "none";
  }

  var PAYLOAD_B64 = "";   /* build.mjs substitutes; empty in debug builds, where
                                     the source is already present as a plain <script> */

  function load() {
    if (window.BFS && typeof window.BFS.main === "function") return Promise.resolve();
    if (typeof DecompressionStream !== "function")
      return Promise.reject(new Error("DecompressionStream('gzip') is unavailable in this browser."));
    var bin = atob(PAYLOAD_B64), n = bin.length, bytes = new Uint8Array(n);
    for (var i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
    return new Response(
      new Response(bytes).body.pipeThrough(new DecompressionStream("gzip"))
    ).text().then(function (src) {
      /* Indirect construction keeps the simulator out of this closure's scope and
         gives DevTools a named, breakpointable script with real line numbers. */
      (new Function(src + "\n//# sourceURL=BingFlightSim.js"))();
      if (!window.BFS || typeof window.BFS.main !== "function")
        throw new Error("payload evaluated but BFS.main is missing");
    });
  }

  step(15, "Decompressing…");
  load().then(function () {
    step(55, "Initialising…");
    step(100, "");
    return window.BFS.main({
      canvas: document.getElementById("gl"),
      overlay: ovl, message: msg, button: go, pill: document.getElementById("pill"),
      /* srcdoc documents have no query string; the sandbox harness and the debug
         build pass parameters through a global instead. */
      params: new URLSearchParams(window.__BFS_PARAMS__ || location.search)
    });
  }).catch(function (e) { fail("Startup failed.", e); });
})();
</script>
