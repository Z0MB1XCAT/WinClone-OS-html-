name: Announce update to Discord

# Runs on every push to main, but only actually posts when WC_VERSION in app.js
# is different from what it was in the previous commit — so ordinary fixes and
# re-uploads stay quiet, and a release announces itself exactly once.
on:
  push:
    branches: [main]
    paths: ['app.js']
  workflow_dispatch:        # ...or fire it by hand from the Actions tab

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2    # need the previous commit to compare versions

      - name: Read version and changelog
        id: read
        run: |
          node -e '
            const fs = require("fs"), cp = require("child_process");

            // Pull WC_VERSION and the WC_CHANGELOG object straight out of app.js.
            function parse(src){
              const ver = (src.match(/WC_VERSION\s*=\s*"([^"]+)"/) || [])[1] || null;
              const lit = (src.match(/const WC_CHANGELOG = \{[\s\S]*?\n\};/) || [])[0];
              let log = {};
              if (lit) { try { log = eval("(" + lit.replace(/^const WC_CHANGELOG = /, "").replace(/;$/, "") + ")"); } catch (e) {} }
              return { ver, log };
            }

            const now = parse(fs.readFileSync("app.js", "utf8"));

            // What was the version one commit ago? (empty on the very first push)
            let before = null;
            try { before = parse(cp.execSync("git show HEAD~1:app.js", { encoding: "utf8" })).ver; } catch (e) {}

            const changed = now.ver && now.ver !== before;
            const notes = (now.log[now.ver] || []).join("\n\n");

            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, "changed=" + (changed ? "yes" : "no") + "\n");
            fs.appendFileSync(out, "version=" + (now.ver || "") + "\n");
            fs.appendFileSync(out, "notes<<WCEOF\n" + notes + "\nWCEOF\n");

            console.log("previous:", before, "→ current:", now.ver, "| announcing:", changed);
          '

      - name: Post to Discord
        if: steps.read.outputs.changed == 'yes'
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE: ${{ secrets.DISCORD_ROLE_ID }}
          VERSION: ${{ steps.read.outputs.version }}
          NOTES: ${{ steps.read.outputs.notes }}
        run: |
          node -e '
            const notes = process.env.NOTES || "";
            const role  = process.env.DISCORD_ROLE_ID || process.env.ROLE;

            const payload = {
              content: (role ? "<@&" + role + "> " : "") +
                       "WinClone version " + process.env.VERSION + " has released! whats new?",
              // An embed is used rather than more content text: content caps at
              // 2000 characters and your changelogs have run longer than that.
              embeds: [{
                title: "WinClone " + process.env.VERSION,
                description: notes.slice(0, 4000),
                color: 0x0078d7,
                url: "https://turkballbredissus.github.io/WinClone-OS-html-/"
              }],
              // Without this the <@&…> renders as a ping but notifies nobody.
              allowed_mentions: { parse: [], roles: role ? [role] : [] }
            };

            fetch(process.env.HOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).then(r => {
              if (!r.ok) return r.text().then(t => { throw new Error(r.status + " " + t); });
              console.log("posted");
            }).catch(e => { console.error(e.message); process.exit(1); });
          '
